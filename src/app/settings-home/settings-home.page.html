<ion-header class="settings-theme-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title [class.condensate]="isCondensate">{{ 'SETTINGS.SETTINGS' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="settings-theme-content" (ionScroll)="onScroll($event)" [scrollEvents]="true">
<ion-list lines="none">
  <ion-item>
    <h3>Data</h3>
  </ion-item>
  <ion-item [button]="true" [detail]="false" [routerLink]="'data-notes'">
    <ion-label>{{'SETTINGS.Tasks' | translate}}</ion-label>
    <ion-icon color="medium" name="chevron-forward"></ion-icon>
  </ion-item>
  <ion-item [button]="true" [detail]="false" [routerLink]="'data-tags'">
    <ion-label>{{'SETTINGS.Subjects' | translate}}</ion-label>
    <ion-icon color="medium" name="chevron-forward"></ion-icon>
  </ion-item>
</ion-list>

<ion-list lines="none">
  <ion-item>
    <h3>{{'SETTINGS.Appearance' | translate}}</h3>
  </ion-item>
  <ion-item [button]="true" [detail]="false">
    <ion-toggle (ionChange)="onToggle('darkMode',$event)" [(ngModel)]="this.settings.darkMode">
      <ion-label>Dark mode</ion-label>
    </ion-toggle>
  </ion-item>
</ion-list>

<ion-list lines="none">
  <ion-item>
    <h3>Notifications</h3>
  </ion-item>
  <ion-item [button]="true" [detail]="false">
    <ion-toggle (ionChange)="onToggle('reminders',$event)" [(ngModel)]="this.settings.reminders">
      <ion-label>Enable reminders</ion-label>
    </ion-toggle>
  </ion-item>
  <ion-item [button]="true" [detail]="false">
    <ion-toggle (ionChange)="onToggle('urgentDeadlineAlerts',$event)" [(ngModel)]="this.settings.urgentDeadlineAlerts">
      <ion-label>Urgent deadline alerts</ion-label>
    </ion-toggle>
  </ion-item>
</ion-list>
</ion-content>
