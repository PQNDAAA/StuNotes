<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>My Notes</ion-title>
    <ion-button id="addbtn" shape="round" slot="end" (click)="openPopup()">
      <ion-icon name="add-outline" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">My Notes</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-searchbar (ionInput)="eventInput($event)"></ion-searchbar>

  <app-notes-tab (filterChanged)="onFilterChanged($event)"></app-notes-tab>

  <div *ngFor="let card of results | async">
    <app-notecard [card]="card">
    </app-notecard>
  </div>

</ion-content>
