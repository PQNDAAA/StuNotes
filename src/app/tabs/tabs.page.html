<ion-tabs>
  <ion-tab-bar class="custom-tab-bar" slot="bottom">
    <ion-tab-button tab="notes" href="/tabs/notes"  (click)="showAllNotes()">
      <ion-icon aria-hidden="true" name="book"></ion-icon>
      <ion-label>Tasks</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tags" href="/tabs/tags">
      <ion-icon aria-hidden="true" name="school"></ion-icon>
      <ion-label>Subjects</ion-label>
    </ion-tab-button>

    <ion-tab-button>
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>Groups</ion-label>
    </ion-tab-button>

    <ion-tab-button [routerLink]="'/settings'">
      <ion-icon aria-hidden="true" name="settings"></ion-icon>
      <ion-label>Settings</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
