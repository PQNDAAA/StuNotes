<ion-content class="elements-content">
  <div class="spinner-container" *ngIf="isLoading">
  <ion-item lines="none" class="spinner-item">
    <ion-spinner name="circular"></ion-spinner>
  </ion-item>
  </div>

  <div class="profile-container" *ngIf="!isLoading">
    <ion-avatar>
      <img alt="Silhouette of a person's head" src="https://ionicframework.com/docs/img/demos/avatar.svg"/>
    </ion-avatar>
    <div class="user-maininformation" *ngIf="user$ | async as profile">
      <ion-label class="username">{{ profile.username }}</ion-label>
      <ion-label class="email">{{ profile.email }}</ion-label>
    </div>

    <ion-list class="stats-list" lines="none">
      <ion-item class="stats-item" lines="none">
        <div class="stats-content">
          <ion-label class="stats-value">{{ cards }}</ion-label>
          <ion-label class="stats-title">Tâches</ion-label>
        </div>
      </ion-item>
      <ion-item class="stats-item" lines="none">
        <div class="stats-content">
          <ion-label class="stats-value">{{ tags }}</ion-label>
          <ion-label class="stats-title">Matières</ion-label>
        </div>
      </ion-item>
      <ion-item class="stats-item" lines="none">
        <div class="stats-content">
          <ion-label class="stats-value">0</ion-label>
          <ion-label class="stats-title">Groupes</ion-label>
        </div>
      </ion-item>
    </ion-list>

    <ion-list lines="none" *ngIf="user$ | async as profile">
      <ion-list-header>Mes Informations</ion-list-header>

      <div class="items-container">
        <ion-item lines="none">
          <div class="icon-container">
            <ion-icon name="person-outline"></ion-icon>
          </div>
          <div class="information-container">
            <ion-label class="information-label-stacked">Nom d'utilisateur</ion-label>
            <ion-label *ngIf="!isEditing" class="information-label">{{ profile.username }}</ion-label>
            <ion-input *ngIf="isEditing" class="input-editelement" type="text" [value]="profile.username"></ion-input>
          </div>
          <ion-button *ngIf="isEditing" (click)="closeEditing()">OK</ion-button>
          <ion-button fill="clear" slot="end" (click)="startEditing()" *ngIf="!isEditing">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
        </ion-item>

        <ion-item lines="none">
          <div class="icon-container">
            <ion-icon name="mail-outline"></ion-icon>
          </div>

          <div class="information-container">
            <ion-label class="information-label-stacked">Email</ion-label>
            <ion-label class="information-label">{{ profile.email }}</ion-label>
          </div>
          <ion-button fill="clear" slot="end">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
        </ion-item>

        <app-information-card [profile]="profile"></app-information-card>
      </div>
    </ion-list>

  </div>
</ion-content>
