
  <ion-header>
    <ion-toolbar>
      <ion-title>{{editMode ?'Edit Subject' : 'Add Subject'}}</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="background-theme">

  <ion-list>
    <ion-item>
      <ion-input label="Subject Name" [(ngModel)]="tag.name" labelPlacement="fixed" [clearInput]="true" [counter]="true" [maxlength]="25">
      </ion-input>
    </ion-item>
  </ion-list>

  <div class="formbtn">
    <ion-button id="validbtn"  slot="end" (click)="valid()" [strong]="true">
      Save
    </ion-button>
    <ion-button id="cancelbtn" slot="end" (click)="closePopUp()">
      Cancel
    </ion-button>
  </div>

</ion-content>
