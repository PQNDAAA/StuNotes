<ion-header>
  <ion-toolbar>
    <ion-title>My Tags</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngFor="let tag of tags$ | async">
    <app-tagcard [tag]="tag">
    </app-tagcard>
  </div>

  <div class="emptyData" *ngIf="hasEmptyTags">
    <ion-label>No tags have been added yet.</ion-label>
  </div>


</ion-content>
