<ion-header>
  <ion-toolbar>
    <ion-title>My Tags</ion-title>
    <ion-button class="ion-padding" size="small" slot="end" (click)="openPopup()">
      <ion-icon name="add">
      </ion-icon>
    </ion-button>
  </ion-toolbar>
</ion-header>

<ion-content>

  <div *ngFor="let tag of tags$ | async">
    <app-tagcard [tag]="tag">
    </app-tagcard>
  </div>


</ion-content>
