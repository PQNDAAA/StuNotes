<ion-list lines="none">
  <ion-item-sliding>
    <ion-item>
<ion-card>
  <ion-card-content>
    <ion-label>{{this.tag.name}}</ion-label>
  </ion-card-content>
</ion-card>
    </ion-item>
    <ion-item-options side="end" (ionSwipe)="onSwipe()">
      <ion-item-option color="danger" [expandable]="true" (click)="presentAlert()">Delete</ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>
