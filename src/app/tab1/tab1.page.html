<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>My notes</ion-title>
    <ion-button class="ion-padding" slot="end" shape="round" size="small"><ion-icon name="add"></ion-icon></ion-button>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Notes</ion-title>
    </ion-toolbar>
  </ion-header>
</ion-content>
