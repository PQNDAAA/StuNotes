<ion-segment [value]="cardStatus.InProgress" (ionChange)="onSegmentChange($event)">

  <ion-segment-button *ngFor="let status of cardStatusValues" [value]="status">
    <div class="segment-item">
      <ion-label>{{status}}</ion-label>
      <ion-badge [ngStyle]="{'background-color': getStatusColor(status)}">{{filterCardsCount(status)| async}}</ion-badge>
    </div>
  </ion-segment-button>

</ion-segment>
