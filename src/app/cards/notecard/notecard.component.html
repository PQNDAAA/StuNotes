<link rel="stylesheet" href="notecard.component.scss">
<ion-list lines="none">
  <ion-item-sliding>
    <ion-item>
<ion-card>
  <ion-card-header class="card-header">
    <div id="deadline">
    <ion-card-title>
      <ion-badge [ngStyle]="{'background-color': getStatusColor(card.status)}">{{card.status}}</ion-badge>
      {{card.name}}
    </ion-card-title>
      <div id="deadline-items">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>{{deadLineStr}}</ion-label>
      </div>
    </div>
    <ion-icon name="alert-circle-outline" id="important" *ngIf="card.important"></ion-icon>
  </ion-card-header>

  <ion-card-content>
    <ion-label>{{card.description}}</ion-label>
    <ion-label id="tag">{{card.tag}}</ion-label>

    <ion-label id="datelabel">Crée le {{this.dateCard}}</ion-label>

  </ion-card-content>
</ion-card>
    </ion-item>
    <ion-item-options side="end" (ionSwipe)="onSwipe()">
      <ion-item-option class="option-edit" color="primary" [expandable]="true" (click)="this.openPopup()">Edit</ion-item-option>
      <ion-item-option class="option-delete" color="danger" [expandable]="true" (click)="presentAlert()">Delete</ion-item-option>
    </ion-item-options>
  </ion-item-sliding>
</ion-list>
