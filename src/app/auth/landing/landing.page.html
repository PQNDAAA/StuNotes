<ion-content>
  <div class="wrapper">

    <!-- Blobs décoratifs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="hero">
      <div class="logo-wrap">
      <img src="assets/icon/icon-only.png" alt="app-logo" class="app-logo">
      </div>
      <ion-label class="app-name">Stu'Notes</ion-label>
      <ion-label class="app-tagline">Tes notes, tes matières,<br>tout en un seul endroit</ion-label>
    </div>

    <ion-list class="features-list" lines="none">
      <ion-label class="feature">📝 {{ 'SETTINGS.Tasks' | translate}}</ion-label>
      <ion-label class="feature">📚 {{ 'SETTINGS.Subjects' | translate}}</ion-label>
      <ion-label class="feature">👥 {{ 'HOME.Groups' | translate}}</ion-label>
    </ion-list>

    <ion-list class="cta-list" lines="none">
      <ion-button expand="block" class="signup-button" [routerLink]="['/signup']">{{'SIGNUP.CreateAnAccountTitle' | translate}}</ion-button>
      <ion-button expand="block" fill="outline" class="login-button" [routerLink]="['/login']">{{ 'LOGIN.Login' | translate}}</ion-button>
    </ion-list>


  </div>
</ion-content>
