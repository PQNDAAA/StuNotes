<ion-content class="auth-container">
  <ion-card class="auth-content">
    <ion-card-header>
      <ion-card-title>Forgotten Password</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form #forgottenpasswordForm ="ngForm">
      <ion-item lines="none" class="inputElement">
        <ion-input type="email" labelPlacement="stacked" label="Email" name="email"></ion-input>
      </ion-item>
        <ion-button class="validBtn">
          Valider
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
